# lanlimit.sh 配置文件 —— 按 IP 或 MAC 给单台 LAN 设备限速
#
# 每一行一台设备，三个字段，空格分隔：
#     <目标>   <下行 kbit>   <上行 kbit>
#
#   <目标>    IP（192.168.9.100）或 MAC（A4:5E:60:11:22:33，大小写都行）
#             MAC 会在应用时通过 dnsmasq 租约表 / ARP 表解析成当前 IP
#   下行/上行 填 0 表示这一方向不限
#
# 以 # 开头的是注释，空行忽略。
#
# 例：
#   192.168.9.100   5120   1024     # 台式机：下 5M / 上 1M
#   A4:5E:60:11:22:33   0   512      # 只限上传 512k（按 MAC）
#
# 改完执行  /usr/bin/lanlimit.sh reload  生效；show 可以看当前生效的类；
# stop 会撤掉全部规则并把硬件加速还回去。
#
# 限速挂在哪里：
#   下行  挂在 LAN 网桥的每个从属口（eth2 / ra0 / rai0）的出口队列上，按目标 IP 匹配
#   上行  挂在网桥主设备 br0 的入口上，镜像到 ifb0 再整形，按源 IP 匹配
#   两边都避开 br0 的 root 队列，所以能与 SQM 共存：各占各的队列，不会互删。
#   未被限速的设备走 default 类，速率取到远高于实际带宽，等价于不限。
#
# 两个前提：
#   ① 这是 QOS 流控（SQM）的子功能，nvram 变量 sqm_enable 不为 1 时整份配置
#      都不生效，脚本会顺手撤掉之前留下的规则。界面上的「按设备限速」表就挂在
#      「启用SQM」开关下面。
#   ② SQM 的模式不要选 1 或 4：那两种模式下 SQM 整形的就是某个 LAN 从属口，
#      一个网口只容得下一个根队列，该口的下行限速会挂不上去（上行不受影响）。
#      要两者同时用，SQM 的模式选 2 或 3（整形 br0）。
#
# 注意：硬件 NAT 加速（hw_nat_mode）会把已建立的长连接（下载、看视频）直接在
# MT7621 的 PPE 硬件里直通转发，包不进内核协议栈，也就不经过 tc，限速对它们
# 无效。只要本文件里有生效的条目，脚本会自动把它关掉并卸载 hw_nat 模块（由
# nvram 变量 lanlimit_autohwnat 控制，默认为开）；清空本文件或执行 stop 会把
# 原值还回去。
#
# 顺带澄清 SFE（sfe_enable / shortcut_fe）：它挂在内核的 POST_ROUTING 钩子上，
# 省掉的是路由查找和 FORWARD 链，而 tc 的队列在它之前（网卡入口）和之后
# （网卡出口），所以 SFE 不会让包绕过限速。脚本把 sfe_enable 一起置 0 只是保守
# 起见，不需要、也不应该去卸载它的模块 —— 2026-10-22 设备实测：限速生效期间
# shortcut_fe / fast_classifier 仍在内存里，限速照常工作。
#
# 手动关闭该开关时需自己处理：nvram set hw_nat_mode=0 && nvram set sfe_enable=0
# 然后 nvram commit 并重启。

# 下面这行是示例，已注释掉 —— 本文件会被 copyscripts.sh 整份拷成
# /etc/storage/lanlimit.conf，留一条未注释的规则会让「恢复出厂设置」凭空
# 多出一条限速。要用请取消注释并改成自己的设备。
# 192.168.9.100   5120   1024
