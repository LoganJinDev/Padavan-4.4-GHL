# GHL 分支固件构建（fork 自 TurBoTse/padavan 的 Padavan 4.4 内核）
# 仓库归属：https://github.com/LoganJinDev/Padavan-4.4-GHL

name: Custom Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select router device"
        required: true
        type: choice
        options:
          - 360-T6M
          - 360-T6M-PB
          - B70
          - BELL-A040WQ
          - C-Life-XG1
          - CR660x
          - DIR-878
          - DIR-882
          - EA7500
          - G-AX1800
          - G-AX1800-B
          - GHL
          - HAR-20S2U1
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q10Pro
          - JCG-Q10Pro-PB
          - JCG-Q11Pro
          - JCG-Q20
          - JCG-Q20-PB
          - JCG-Y2
          - JDCLOUD-RE-CP-02
          - JDCLOUD-RE-SP-01B
          - K2P
          - K2P-NANO
          - K2P-USB
          - KOMI-A8
          - MI-4
          - MI-R3G
          - MI-R3P-PB
          - MI-R3P-SPI
          - MI-R3P
          - MI-R4A
          - MR2600
          - MSG1500
          - MSG1500-Z
          - NETGEAR-BZV
          - NETGEAR-R6800
          - NETGEAR-R7450
          - NEWIFI
          - NEWIFI3
          - QM-B1
          - R2100
          - RM2100
          - RT-AC85P
          - SIM-AX1800T
          - TX1801
          - WDR8620
          - WRL18M4GD
          - WE410443-TC
          - WIA3300-10
          - WR1200JS
          - XY-C1
          - ZTE-E8820S
          - ZTE-E8820V2
          - ZTT-RX6000
        default: K2P
      toolchain:
        description: "Select compilation toolchain"
        required: true
        type: choice
        options:
          - mipsel-linux-musl
          - mipsel-linux-uclibc
        default: mipsel-linux-musl
      cpufreq:
        description: "Enable CPU Overclocking"
        type: boolean
        default: false
      mt7621_oc:
        description: "1000Mhz=0x312 1100Mhz=0x362 1120Mhz=0x372 1200Mhz=0x3B2"
        type: choice
        options: [ '0x312', '0x362', '0x372', '0x3B2' ]
      plugins:
        description: 'Plugin JSON。键=插件名（小写），值=y 安装 / n 不装。默认=GHL 全量 39 项'
        required: true
        type: string
        default: '{"sfe":"y","antfs":"y","qos":"y","ifb":"y","ipset":"y","lang_cn":"y","tcpdump":"y","hdparm":"y","parted":"y","ftpd":"y","eap_peap":"y","sftp":"y","openssh":"y","openvpn":"y","openssl_ec":"y","xupnpd":"y","aria":"y","aria_web_control":"y","curl":"y","ttyd":"y","msd_lite":"y","lrzsz":"y","htop":"y","nano":"y","mtr":"y","socat":"y","frpc":"y","frps":"y","shadowsocks":"y","xray":"y","trojan":"y","3proxy":"y","microsocks":"y","sssserver":"y","zerotier":"y","aliddns":"y","ddnsto":"y","sqm":"y","wireguard":"y"}'
      customization:
        description: 'Customization JSON'
        required: true
        type: string
        # ★ lanip 留空 = 沿用板型默认值：GHL=192.168.9.1、MI-R3G=192.168.32.1、
        #   MI-R3P=192.168.31.1（定义在各板 configs/boards/<PID>/board.h）。
        #   留空时 setip.sh 只回填 CN.dict 的提示文案，一个 #define 都不动。
        #   填了地址则 defaults.h 与 board.h 一起按宏名改写（board.h 的 #ifndef 会盖住 defaults.h）。
        #   其余 53 个板型没在 board.h 里定义 DEF_LAN_ADDR，留空即走上游默认 192.168.2.1，行为不变。
        #   ★ 全部留空 = 各板沿用出厂默认值，一个 #define 都不动：
        #     GHL=GHL/GHL_5G（board.h）、MI-R3G/MI-R3P=BOARD_PID "_%s"（defaults.h）、
        #     其余板型同上。要自定义就填，填了在 defaults.h 与 board.h 两处一起生效。
        #     （旧默认值 wifi2gssid="Padavan" 是空头支票：setwifi.sh 的绝对行号 sed
        #       自 303108e3c 起就是死操作，该值从未生效过。）
        default: '{"lanip":"","signaccount":"","signpassword":"","wifi2gssid":"","wifi2gpsk":"","wifi5gssid":"","wifi5gpsk":""}'
      nanoversion:
        description: "Build Nano Version"
        type: boolean
        default: false
      release:
        description: "Upload to GitHub Release"
        type: boolean
        default: true
      oldworkflow:
        description: "Delete Old Workflows"
        type: boolean
        default: true

env:
  # 固件名前缀，同时决定 Release 里 trx 的文件名。
  # 文件名公式：${FIRMWARE_AUTHOR}-<target>-Padavan-4.4-<toolchain>[-nano][-cpufreq-<oc>]-<BUILD_DATE>.trx
  # 注意：trunk/vendors/Ralink/Makefile 的 IMAGE_NAME 是另一处独立耦合（build.yml 不改名，只吃那边），改名字要两处一起改。
  FIRMWARE_AUTHOR: Logan
  TOOLCHAIN: ${{ inputs.toolchain }}
  # 预编译交叉工具链已自托管到本仓库 tag "toolchain" 的 Release（从上游 TurBoTse/padavan 原样搬运）。
  # 要更换/新增工具链，往同一个 tag 的 Release 里补传 <toolchain>.tar.xz 即可，这里不用改。
  TOOLCHAIN_URL: https://github.com/LoganJinDev/Padavan-4.4-GHL/releases/download/toolchain/${{ inputs.toolchain }}.tar.xz
  CONFIGFILE: trunk/configs/templates/${{ inputs.target }}.config

jobs:
  build:
    name: Build ${{ inputs.target }}-${{ inputs.toolchain }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ inputs.target }}-${{ inputs.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev jq
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Validate Input JSON
        run: |
          jq empty <<< '${{ inputs.plugins }}' || { echo "❌ Invalid plugins JSON"; exit 1; }
          jq empty <<< '${{ inputs.customization }}' || { echo "❌ Invalid customization JSON"; exit 1; }

      - name: Export Customization & Plugin Flags
        run: |
          export_json() {
            local JSON=$1
            local PREFIX=$2
            echo "$JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r k v; do
              echo "${PREFIX}${k^^}=$v" >> $GITHUB_ENV
            done
          }

          export_json '${{ inputs.customization }}' ""
          if [ "${{ inputs.nanoversion }}" = "true" ]; then
            echo "⚠️ Nano version — all plugins disabled."
            echo '${{ inputs.plugins }}' | jq 'with_entries(.value="n")' > plugins_fixed.json
          else
            echo '${{ inputs.plugins }}' > plugins_fixed.json
          fi
          export_json "$(cat plugins_fixed.json)" "PLUGIN_"

      - name: Apply Configurations
        run: |
          chmod +x trunk/custom/scripts/*.sh || true

          # 板型 ID 必须从模板里读，不能从 inputs.target 推 —— 两者未必同名：
          # K2P-NANO.config 里是 CONFIG_FIRMWARE_PRODUCT_ID="K2P"，而 board.h /
          # kernel-4.4.x.config / DTS 全部按 PRODUCT_ID 定位目录（boards/K2P-NANO 并不存在）。
          PRODUCT_ID=$(sed -n 's/^CONFIG_FIRMWARE_PRODUCT_ID="\(.*\)"$/\1/p' "$CONFIGFILE" | head -n 1)
          if [ -z "$PRODUCT_ID" ]; then
            echo "❌ $CONFIGFILE 里读不到 CONFIG_FIRMWARE_PRODUCT_ID，无法定位板型目录"
            exit 1
          fi
          BOARD_H="trunk/configs/boards/${PRODUCT_ID}/board.h"
          echo "PRODUCT_ID=${PRODUCT_ID}" >> $GITHUB_ENV
          echo "板型: PRODUCT_ID=${PRODUCT_ID}  board.h=${BOARD_H}"

          # 第 4 个参数是 board.h —— 见上面 customization.lanip 的说明
          bash trunk/custom/scripts/setip.sh "$LANIP" trunk/user/shared/src/defaults.h trunk/user/www/dict/CN.dict "$BOARD_H"
          bash trunk/custom/scripts/setaccount.sh "$SIGNACCOUNT" "$SIGNPASSWORD" trunk/user/shared/src/defaults.h "$BOARD_H"
          bash trunk/custom/scripts/setwifi.sh "$WIFI2GSSID" "$WIFI2GPSK" "$WIFI5GSSID" "$WIFI5GPSK" trunk/user/shared/src/defaults.h "$BOARD_H"

          for key in $(env | grep '^PLUGIN_' | cut -d= -f1); do
            echo "CONFIG_FIRMWARE_INCLUDE_${key#PLUGIN_}=${!key}" >> "$CONFIGFILE"
          done

          if [ "${{ inputs.cpufreq }}" = "true" ]; then
            echo "CONFIG_FIRMWARE_INCLUDE_OC=y" >> "$CONFIGFILE"
            echo "CONFIG_FIRMWARE_MT7621_OC=${{ inputs.mt7621_oc }}" >> "$CONFIGFILE"
          fi

      - name: Apply Nano Optimization
        if: ${{ inputs.nanoversion }}
        run: |
          for fs in ANTFS FAT EXFAT EXT2 EXT3 EXT4 XFS FUSE SWAP; do
            sed -i "s/CONFIG_FIRMWARE_ENABLE_${fs}=y/CONFIG_FIRMWARE_ENABLE_${fs}=n/" "$CONFIGFILE"
          done
          modules=(UVC HID SERIAL AUDIO XFRM QOS IMQ IFB NFSD NFSC CIFS NTFS_3G LPRD U2EC TCPDUMP HDPARM PARTED 
            SMBD WINS SMBD_SYSLOG FTPD RPL2TP EAP_PEAP HTTPS SFTP DROPBEAR DROPBEAR_FAST_CODE OPENSSH OPENVPN SSWAN 
            OPENSSL_EC OPENSSL_EXE XUPNPD MINIDLNA FIREFLY FFMPEG_NEW TRANSMISSION TRANSMISSION_WEB_CONTROL ARIA 
            ARIA_WEB_CONTROL CURL SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP NJIT_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT 
            SOFTETHERVPN_CMD VLMCSD TTYD MSD_LITE LRZSZ HTOP NANO IPERF3 DUMP1090 RTL_SDR MTR SOCAT SRELAY MENTOHUST 
            FRPC FRPS REDSOCKS SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS SINGBOX NAIVEPROXY ADBYBY DNSFORWARDER SMARTDNS 
            ADGUARDHOME ZEROTIER ALIDDNS DDNSTO ALDRIVER SQM WIREGUARD )
          for m in "${modules[@]}"; do
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_${m}=y/CONFIG_FIRMWARE_INCLUDE_${m}=n/" "$CONFIGFILE"
          done

      # 缓存第三方源码包目录 trunk/download，绕开上游单点
      # （已实测两个：udns 唯一源 corpit.ru；lzma2602.7z 唯一源 www.7-zip.org）。
      # 机理：trunk/include/download.mk 里 "$(DL_DIR)/$(FILE):" 这条规则【没有前置依赖】，
      #       只要目标文件已存在，make 就整个跳过下载配方、根本不访问上游 ⇒ 缓存即根治。
      #       佐证：trunk/tools/download.pl:333-349，本地文件哈希对得上就直接 exit 0。
      #
      # ★ 为什么必须拆成 restore + save 两步，而不能用 actions/cache@v4：
      #   actions/cache@v4 的 action.yml 里是 post-if: "success()" ⇒ 【只在 job 成功时才写缓存】。
      #   而要治的恰恰是"下载失败导致 job 失败" ⇒ 缓存永远填不进去，鸡生蛋死锁。
      #   已实证：run 41375214390 的 "Post Cache third-party downloads" 结论 = skipped，
      #   且 actions/caches 里 padavan-download-* 计数 = 0。
      #   拆开后 save 带 if: always()，失败的那轮也能把已下到的包存下来 ⇒ 形成棘轮，
      #   每轮 CI 都比上一轮多推进一点，最终收敛到"包全齐、不再碰上游"。
      # 注：actions/cache 写入后不可变，故用「滚动缓存」——key 带 run_id 保证每轮另存一份新的，
      #     restore-keys 前缀命中最近一份，避免某次不完整的缓存被永久冻结住。
      - name: Restore third-party downloads
        uses: actions/cache/restore@v4
        with:
          path: trunk/download
          key: padavan-download-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            padavan-download-${{ runner.os }}-

      - name: Build Firmware
        run: |
          # 上游下载是主要失败面，且是【瞬时】的：实测 www.7-zip.org 出现
          # "curl: (6) Could not resolve host"（DNS 解析失败，不是超时）。
          # make 是增量的、trunk/download/ 在同一 job 内跨重试保留 ⇒
          # 重试只需补下缺的那几个包，比等下一轮 CI 便宜一个数量级。
          # ★ 不能写 `[ $i -lt 3 ] && sleep 60`：run 的默认 shell 是 bash -e，
          #   条件为假时该 AND-list 返回 1 会让整个步骤立刻中止（已踩过的坑）。
          ok=0
          for i in 1 2 3; do
            echo "===== 构建尝试 ${i}/3 ====="
            if make ${{ inputs.target }} TOOLCHAIN=${{ inputs.toolchain }}; then ok=1; break; fi
            echo "⚠️ 第 ${i} 次构建失败（多为上游下载瞬时故障），已下到的包会保留"
            if [ "$i" -lt 3 ]; then sleep 60; fi
          done
          if [ "$ok" != "1" ]; then
            echo "❌ 构建连续 3 次失败，判定为真实故障而非上游抖动"
            exit 1
          fi
          mkdir -p trunk/output
          base="${FIRMWARE_AUTHOR}-${{ inputs.target }}-Padavan-4.4-${{ inputs.toolchain }}"
          [ "${{ inputs.nanoversion }}" = "true" ] && base="${base}-nano"
          [ "${{ inputs.cpufreq }}" = "true" ] && base="${base}-cpufreq-${{ inputs.mt7621_oc }}"
          base="${base}-${BUILD_DATE}"
          i=1
          for f in trunk/images/*.trx; do
            suffix=""
            [ $i -gt 1 ] && suffix="-$i"
            mv "$f" "trunk/output/${base}${suffix}.trx"
            i=$((i+1))
          done

      # ★ if: always() 是这套方案的关键：构建失败（典型是上游下载挂了）时也要把
      #   已下到的包存下来，下一轮 CI 才能接着往前推。continue-on-error 保证缓存
      #   这类辅助设施出问题时不掩盖真正的构建结果。
      - name: Save third-party downloads
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: trunk/download
          key: padavan-download-${{ runner.os }}-${{ github.run_id }}

      - uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.target }}-${{ inputs.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/output/*.trx

      - name: Verify Firmware Fits Partition
        run: |
          # 体积守卫。Padavan 的 rootfs 是【单个只读 squashfs】，没有 opkg、没有可写覆盖层
          # ⇒ 固件必须整份落进 DTS 的 "firmware" 分区。仓库原本没有任何体积校验，
          # 超了照样"构建成功"，刷进去是起不来的砖（刷机按名字写 firmware 分区）。
          # 退出码：0=通过 / 1=超限（硬失败）/ 2=无法判定（只告警，不阻断好固件）
          # 放在 upload-artifact 之后：超限时产物仍可下载排查，但 Release 被拦住。
          set +e
          bash trunk/custom/scripts/check_fw_size.sh "$PRODUCT_ID" trunk/output/*.trx
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "❌ 固件超出 firmware 分区，已中止发布"
            exit 1
          fi
          echo "（size-guard rc=$rc：0=通过、2=无法判定，均放行）"

      - uses: softprops/action-gh-release@master
        if: ${{ inputs.release }}
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: ${{ env.BUILD_DATE }}
          body: |
            Build Summary:
            - Date: ${{ env.BUILD_DATE }}
            - Target: ${{ inputs.target }} (PRODUCT_ID: ${{ env.PRODUCT_ID }})
            - Toolchain: ${{ inputs.toolchain }}
            - Nano: ${{ inputs.nanoversion }}
            - CPU OC: ${{ inputs.cpufreq }} (${{ inputs.mt7621_oc }})
            - Plugins: ${{ inputs.plugins }}
            - Custom: ${{ inputs.customization }}
          files: trunk/output/*.trx

      - uses: Mattraks/delete-workflow-runs@main
        if: ${{ inputs.oldworkflow }}
        with:
          retain_days: 0
          keep_minimum_runs: 1
