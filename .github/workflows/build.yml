name: Build Firmware

on:
  # 只保留手动触发。原先的 push 触发会在每次推分支时自动编 K2P/K2P-USB 并发布 Release，
  # 把这个 GHL 仓库的历史搅乱。等 GHL 分支稳定后再改回 push 自动构建。
  workflow_dispatch:
    inputs:
      target:
        description: "Select router device"
        required: true
        type: choice
        options: [GHL, K2P, K2P-USB]
        default: GHL
      toolchain:
        description: "Select compilation toolchain"
        required: true
        type: choice
        options: [mipsel-linux-musl, mipsel-linux-uclibc]
        default: mipsel-linux-musl

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ inputs.target }}"]
        toolchain: ["${{ inputs.toolchain }}"]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Build Firmware
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@main
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: true

      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1